# NeMo-RL pipeline backend: RunConfig compiled to a NeMo-RL GRPO config (DTensor policy, vLLM
# generation, Ray virtual cluster); monorl's math_verify reward runs inside NeMo-RL's
# EnvironmentInterface bridge. Needs NEMO_RL_HOME pointing at a NeMo-RL checkout (git-only,
# tag v0.7.0). Targets 2 nodes x 8 GPUs with a 7B policy.
run_name: nemo-rl-grpo-math
model:
  name_or_path: Qwen/Qwen2.5-Math-7B
  dtype: bfloat16
data:
  uri: hf://DigitalLearningGmbH/MATH-lighteval
  split: train
  format: prompt_answer
  prompt_field: problem
  answer_field: solution
  system_prompt: "Think step by step and put the final answer in \\boxed{}."
  max_prompt_tokens: 1024
algorithm:
  name: grpo
  kl_coef: 0.01
  advantage_norm: group
  loss_agg: token
rollout:
  backend: vllm
  group_size: 16
  max_new_tokens: 4096
  temperature: 1.0
  tensor_parallel_size: 2
  gpu_memory_utilization: 0.6
trainer:
  backend: nemo_rl
  learning_rate: 3.0e-7
  prompts_per_step: 64
  micro_batch_size: 2
  max_steps: 300
  precision: bf16
  gradient_checkpointing: true
  save_every: 25
  max_seq_len: 5120
  extra:
    # nemo_rl_home: /path/to/NeMo-RL      # or export NEMO_RL_HOME (checkout at tag v0.7.0)
    nemo_rl_launcher: uv
    dtensor:
      tensor_parallel_size: 2
    nemo_rl:
      grpo:
        num_prompts_per_step: 64
rewards:
  - type: math_verify
env:
  type: single_turn
cluster:
  mode: ray
  ray_address: auto
  num_nodes: 2
  gpus_per_node: 8
  placement: disaggregated
  rollout_gpus: 8
  trainer_gpus: 8
  weight_sync: broadcast
